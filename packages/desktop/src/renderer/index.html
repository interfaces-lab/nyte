<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nyte</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /*
       * Startup shell. Paints before any module runs, so it carries its own
       * palette. App tokens take over once loaded. Before boot.ts applies the
       * stored theme on <html>, light-dark() follows the OS color scheme.
       */
      html {
        color-scheme: light dark;
      }
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #startup {
        --startup-bg: var(--nyte-bg-chrome, light-dark(#f8f8f8, #111111));
        --startup-text: var(--nyte-text-primary, light-dark(#141414, #fcfcfc));
        --startup-fill: var(--nyte-fill-primary, light-dark(#141414, #fcfcfc));
        --startup-fill-hover: var(--nyte-fill-primary-hover, light-dark(#2a2a2a, #dedede));
        --startup-on-fill: var(--nyte-text-invert, light-dark(#fcfcfc, #141414));
        --startup-accent: var(--nyte-accent-base, #1084fe);
        --startup-moon-color: light-dark(#ff9800, #ffc663);
        box-sizing: border-box;
        height: 100dvh;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--startup-bg);
        color: var(--startup-text);
        font-family: var(--nyte-font-family-sans, system-ui, sans-serif);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      /* Empty stand-in for the shell titlebar so the window stays draggable while it boots. */
      .startup-drag {
        height: 35px;
        -webkit-app-region: drag;
      }
      .startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: auto;
        padding-bottom: 35px; /* offsets the titlebar row so the moon sits on the window center */
        user-select: none;
      }
      /*
       * ASCII moon: a shaded sphere whose surface rotates, drawn as 14 frames
       * stacked in one grid cell and shown one at a time. Every frame is a full
       * disc, so the loop never blinks through an empty new-moon phase.
       * A 23-column by 12-row disc reads as round in monospace cells at
       * 1.15 line-height. Keep the system font stable while bundled fonts load.
       *
       * Frames live in CSS strings with escaped newlines because HTML
       * formatters reflow text nodes and would collapse the art into one line.
       * Regenerate with src/renderer/splash-lab.html.
       */
      .startup-moon {
        display: grid;
        color: var(--startup-moon-color);
        font-family: ui-monospace, monospace;
        width: 23ch;
        font-size: 12px;
        line-height: 1.15;
        text-shadow: 0 0 14px color-mix(in srgb, var(--startup-moon-color) 30%, transparent);
      }
      .startup-moon span {
        grid-area: 1 / 1;
        white-space: pre;
        opacity: 0;
        animation: startup-moon 1.68s steps(1, end) infinite;
        animation-delay: calc(var(--frame, 0) * 0.12s - 1.68s);
      }
      @keyframes startup-moon {
        0% {
          opacity: 1;
        }
        7.142857142857%,
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-moon span {
          animation: none;
        }
        .startup-moon span:first-child {
          opacity: 1;
        }
      }

        content: "       %%####**+\00000a    %@@%%%###***++=\00000a  #%@@@%%%##***++++=:\00000a %@@@@@@%%##***++++==:\00000a%@@@@@@@%%%##***+++==::\00000a%@@@@@@@@%%###***++==::\00000a%@@@@@@@@%%%##***++=:::\00000a#%%%%%%%%%%%##***++=:::\00000a #############**++=:::\00000a  ************++=::::\00000a    ++++++++++=::::\00000a       :===:::::";
      }

      }

      }

        content: "       #######**\00000a    #####%%%%%##**=\00000a  #*###%%%%%%%%##**+:\00000a #**##%%%%%@@%%%##*+=:\00000a#####%%%%@@@%%%##**+=::\00000a###%%%%%@@@@%%##**+==::\00000a#%%%%%%@@@%%%#**++==:::\00000a#%%%%%@@%%%%#**++==::::\00000a #%%%%%%%###**++==::::\00000a  *######***+++==::::\00000a    ****++++===::::\00000a       :==::::::";
      }

        content: "       ##%%%##**\00000a    ##%%%%@%%%##**=\00000a  *#%%%@@@@@%%%##**=:\00000a *#%%@@@@@@@@%%%##*+=:\00000a*#%%@@@@@@%%%%###**+=::\00000a#%%@@@@@@%%####***++=::\00000a#%%@@@@%%%##*****++=:::\00000a#%%@@@%%###**+++++==:::\00000a #%%%%%###**++++==::::\00000a  *####*****+++==::::\00000a    +++++++++==::::\00000a       :==::::::";
      }

        content: "       #%%%%##**\00000a    #%@@@@@%%%##*+=\00000a  #%@@@@@@@@%%%##*+=:\00000a #%@@@@@@@@@@%%##*+=::\00000a#%@@@@@@@%%%%%%##*++=::\00000a%@@@@%%%%%%%#####*+=:::\00000a%@@%%%##########**+=:::\00000a#%%%%##**********+=::::\00000a ######*********++=:::\00000a  **********++++=::::\00000a    ++++**+++==::::\00000a       :===:::::";
      }

      }
      .startup-moon span:nth-child(10)::before {
        content: "       %%%%%##**\00000a    %%%%%%%%%##**+=\00000a  %%%%%%%%%%%%##*++=:\00000a %%%%%%%%%%%%%%#**++=:\00000a%%%####%%%%%%%%##**+=::\00000a%%%####%%%%%%%%##**+=::\00000a%%%%%%%%%%%%%%###*++:::\00000a#%%%%%%%%%%%%##**++=:::\00000a #%%%%%%%%%###**++=:::\00000a  *#########**++=::::\00000a    *******+++=::::\00000a       :===:::::";
      }
      .startup-moon span:nth-child(11)::before {
        content: "       %%%%%##*+\00000a    %%@@@@%%###***=\00000a  %%%%@@@@%%##****++:\00000a ##%%%@@@@@%%###***+=:\00000a###%%%@@@@@%%%###**+=::\00000a###%%%@@@@@@%%%##**+=::\00000a##%%%%@@@@%%%%###*++:::\00000a###%%%%@%%%%%##**++=:::\00000a ##%%%%%%%%###**+=::::\00000a  *#########**++=::::\00000a    *******+++=::::\00000a       :===:::::";
      }
      .startup-moon span:nth-child(12)::before {
        content: "       %%%%%##*+\00000a    %@@%%%%#####*+=\00000a  %%@@@%%########*+=:\00000a #%@@@@%%%%%%%%%##*+=:\00000a*%%@@@@@@%%%%%%###*+=::\00000a#%@@@@@@@@@@%%%##**+=::\00000a#%%@@@@@@@%%%%##**+=:::\00000a*%%@@@@@%%%%%##**+=::::\00000a #%%%%%%%%%##**++=::::\00000a  *########**++==::::\00000a    *******++==::::\00000a       :===:::::";
      }
      .startup-moon span:nth-child(13)::before {
        content: "       %%%%###*+\00000a    %%%%%%%%%##**+=\00000a  %%%%#%%%%@%%##*++=:\00000a %@%%%%%%@@@@%%##*+=::\00000a#@@@@@@@@@@@%%%##*++=::\00000a%@@@@@@@@@@@%%%##*++=::\00000a%@@@@@@@@@%%%###**+=:::\00000a#%%@@@@@%%%###***++=:::\00000a #%%%%%%###***+++==:::\00000a  *######***+++==::::\00000a    *****+++===::::\00000a       :===:::::";
      }
      .startup-moon span:nth-child(14)::before {
        content: "       %%%###**+\00000a    %%%%@%%%##**++=\00000a  ##%%@@@@%%##**++==:\00000a %%%@@@@@@@%%##**+==::\00000a%%@@@@@@@@@%%##**++=:::\00000a%@@@@@@@@@@@%%##*++=:::\00000a%@@@@@@@%%%%%%##*++=:::\00000a#%%@%%%%%######**+==:::\00000a #%%%#####******++=:::\00000a  *###*******+++=::::\00000a    ****+++++==::::\00000a       :==::::::";
      }
      #startup-message {
        margin: 20px 0 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      #startup-retry {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 16px;
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--startup-fill);
        color: var(--startup-on-fill);
        font: inherit;
        font-weight: 500;
        cursor: default;
        -webkit-app-region: no-drag;
      }
      #startup-retry:hover {
        background: var(--startup-fill-hover);
      }
      #startup-retry:active {
        opacity: 0.8;
      }
      #startup-retry:focus-visible {
        outline: 2px solid var(--startup-accent);
        outline-offset: 2px;
      }
      .startup-assistive {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      #startup[data-state="loading"] :is(#startup-message, #startup-retry),
      #startup[data-state="error"] :is(.startup-moon, .startup-assistive) {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup" data-state="loading">
        <div class="startup-drag"></div>
        <section class="startup-content" role="status" aria-live="polite" aria-atomic="true">
          <div class="startup-moon" aria-hidden="true">
            <span style="--frame: 0"></span>
            <span style="--frame: 1"></span>
            <span style="--frame: 2"></span>
            <span style="--frame: 3"></span>
            <span style="--frame: 4"></span>
            <span style="--frame: 5"></span>
            <span style="--frame: 6"></span>
            <span style="--frame: 7"></span>
            <span style="--frame: 8"></span>
            <span style="--frame: 9"></span>
            <span style="--frame: 10"></span>
            <span style="--frame: 11"></span>
            <span style="--frame: 12"></span>
            <span style="--frame: 13"></span>
          </div>
          <span class="startup-assistive">Loading</span>
          <p id="startup-message"></p>
          <button id="startup-retry" type="button">
            <!-- Central Icons: IconArrowRotateClockwise -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M18.5 7.00891C16.6791 4.95438 14.7962 3.75 11.979 3.75C7.42266 3.75 3.729 7.44365 3.729 12C3.729 16.5563 7.42266 20.25 11.979 20.25C15.5711 20.25 18.627 17.9543 19.7596 14.75M19.25 4V8H15.25"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Try again
          </button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
