<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nyte</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /*
       * Startup shell. Paints before any module runs, so it carries its own
       * palette. App tokens take over once loaded. Before boot.ts applies the
       * stored theme on <html>, light-dark() follows the OS color scheme.
       */
      html {
        color-scheme: light dark;
      }
      html[data-display-mode="light"] {
        color-scheme: light;
      }
      html[data-display-mode="dark"] {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #startup {
        --startup-moon-color: light-dark(#232a44, #c1d0f6);
        box-sizing: border-box;
        height: 100dvh;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(
          --startup-bg,
          light-dark(lab(99.9996% -0.00357628 -0.0378609), lab(9.7636% 0 0))
        );
        color: var(
          --startup-text,
          light-dark(lab(17.9803% -0.180662 0.655705), lab(90.9749% 0.0809431 1.06326))
        );
        font-family: var(--startup-font, system-ui, sans-serif);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      /* Empty stand-in for the shell titlebar so the window stays draggable while it boots. */
      .startup-drag {
        height: 35px;
        -webkit-app-region: drag;
      }
      .startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: auto;
        padding-bottom: 35px; /* offsets the titlebar row so the moon sits on the window center */
        user-select: none;
      }
      /*
       * ASCII moon: the landing page's moon running its phase loop, full to new
       * and back while the surface turns once, drawn as 24 frames stacked in
       * one grid cell and shown one at a time. The dark side keeps a grain of
       * earthshine, so the new moon never blinks out. A 48-column by 29-row
       * disc reads as round in 0.6em monospace cells at 1em line-height. Keep
       * the system font stable while bundled fonts load.
       *
       * Frames live in CSS strings with escaped newlines because HTML
       * formatters reflow text nodes and would collapse the art into one line.
       * Baked with renderMoon from packages/docs/src/components/landing/moon/
       * moon-surface.ts at RAMP " .'`:-=+*o%#@": frame i of 24 is
       * { ...viewAt(i * 1.25), lonTilt: i * 15 }.
       */
      .startup-moon {
        display: grid;
        color: var(--startup-moon-color);
        font-family: ui-monospace, monospace;
        width: 48ch;
        font-size: 8px;
        line-height: 1;
        text-shadow: 0 0 12px color-mix(in srgb, var(--startup-moon-color) 35%, transparent);
      }
      .startup-moon span {
        grid-area: 1 / 1;
        white-space: pre;
        opacity: 0;
        animation: startup-moon 3s steps(1, end) infinite;
        animation-delay: calc(var(--frame, 0) * 0.125s - 3s);
      }
      @keyframes startup-moon {
        0% {
          opacity: 1;
        }
        4.166666666667%,
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-moon span {
          animation: none;
        }
        .startup-moon span:first-child {
          opacity: 1;
        }
      }

        background: var(--startup-hover, lab(38.8331% -4.16589 -29.326));
      }
      #startup-retry:active {
        background: var(--startup-pressed, lab(38.8331% -4.16589 -29.326));
      }
      #startup-retry:focus-visible {
        outline: 2px solid var(--startup-accent, lab(53.1052% -1.53607 -54.9391));

      }
      .startup-assistive {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);

      #startup[data-state="loading"] :is(#startup-message, #startup-retry),
      #startup[data-state="error"] :is(.startup-moon, .startup-assistive) {

      }
