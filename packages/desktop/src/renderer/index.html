<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nyte</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /*
       * Startup shell. Paints before any module runs, so it carries its own
       * palette. Each value falls back to tokens.css once that loads; until
       * then light-dark() follows the color scheme boot.ts sets on <html>,
       * or the OS when no preference is stored yet.
       */
      html {
        color-scheme: light dark;
      }
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #startup {
        --startup-bg: var(--sand-bg-base, light-dark(#f5f5f6, #131417));
        --startup-text: var(--sand-text-primary, light-dark(#141414, #fcfcfc));
        --startup-muted: var(--sand-text-tertiary, light-dark(#14141499, #fcfcfc66));
        --startup-fill: var(--sand-fill-primary, light-dark(#070707, #fafafa));
        --startup-fill-hover: var(--sand-fill-primary-hover, light-dark(#2f2f2f, #d5d5d5));
        --startup-on-fill: var(--sand-text-on-primary, light-dark(#fcfcfc, #141414));
        --startup-accent: var(--nyte-accent-base, #1084fe);
        box-sizing: border-box;
        height: 100dvh;
        overflow: auto;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--startup-bg);
        color: var(--startup-text);
        font-family: var(--nyte-font-family-sans, "Inter Variable", system-ui, sans-serif);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      /* Mirrors the shell titlebar: same height, draggable, clear of the traffic lights. */
      .startup-brand {
        display: flex;
        align-items: center;
        height: 35px;
        padding-left: calc(env(titlebar-area-x, 68px) + 10px);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.2px;
        -webkit-app-region: drag;
        user-select: none;
      }
      .startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 320px);
        margin: auto;
        padding: 24px 0 59px; /* keeps the optical center level with the brand row above */
        text-align: center;
      }
      .startup-spinner {
        width: 24px;
        height: 24px;
        margin-bottom: 20px;
        color: var(--startup-accent);
      }
      .startup-spinner rect {
        opacity: 0.7;
        animation: startup-pulse 1.4s ease-in-out infinite both;
      }
      .startup-spinner rect:nth-child(1) {
        animation-delay: 0s;
      }
      .startup-spinner rect:nth-child(2) {
        animation-delay: 0.1s;
      }
      .startup-spinner rect:nth-child(3) {
        animation-delay: 0.9s;
      }
      .startup-spinner rect:nth-child(4) {
        animation-delay: 0.2s;
      }
      .startup-spinner rect:nth-child(5) {
        animation-delay: 0.6s;
      }
      .startup-spinner rect:nth-child(6) {
        animation-delay: 1.1s;
      }
      .startup-spinner rect:nth-child(7) {
        animation-delay: 0.4s;
      }
      .startup-spinner rect:nth-child(8) {
        animation-delay: 0.8s;
      }
      .startup-spinner rect:nth-child(9) {
        animation-delay: 0.3s;
      }
      .startup-spinner rect:nth-child(10) {
        animation-delay: 1.2s;
      }
      .startup-spinner rect:nth-child(11) {
        animation-delay: 0.5s;
      }
      .startup-spinner rect:nth-child(12) {
        animation-delay: 0.7s;
      }
      @keyframes startup-pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner rect {
          animation: none;
        }
      }
      #startup-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.4;
        font-weight: 500;
        letter-spacing: -0.2px;
        text-wrap: balance;
      }
      #startup-status {
        margin: 6px 0 0;
        color: var(--startup-muted);
        font-size: 13px;
        line-height: 1.5;
        text-wrap: pretty;
      }
      #startup-retry {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 20px;
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--startup-fill);
        color: var(--startup-on-fill);
        font: inherit;
        font-weight: 500;
        cursor: default;
        -webkit-app-region: no-drag;
      }
      #startup-retry:hover {
        background: var(--startup-fill-hover);
      }
      #startup-retry:active {
        opacity: 0.8;
      }
      #startup-retry:focus-visible {
        outline: 2px solid var(--startup-accent);
        outline-offset: 2px;
      }
      #startup[data-state="loading"] :is(#startup-status, #startup-retry),
      #startup[data-state="error"] .startup-spinner {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup" data-state="loading">
        <header class="startup-brand">Nyte</header>
        <section class="startup-content" role="status" aria-live="polite" aria-atomic="true">
          <!-- Same 4×4 pulse grid as components/spinner.tsx, minus the corners. -->
          <svg class="startup-spinner" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true">
            <rect x="4" y="0" width="3" height="3" rx="1" />
            <rect x="8" y="0" width="3" height="3" rx="1" />
            <rect x="0" y="4" width="3" height="3" rx="1" />
            <rect x="4" y="4" width="3" height="3" rx="1" />
            <rect x="8" y="4" width="3" height="3" rx="1" />
            <rect x="12" y="4" width="3" height="3" rx="1" />
            <rect x="0" y="8" width="3" height="3" rx="1" />
            <rect x="4" y="8" width="3" height="3" rx="1" />
            <rect x="8" y="8" width="3" height="3" rx="1" />
            <rect x="12" y="8" width="3" height="3" rx="1" />
            <rect x="4" y="12" width="3" height="3" rx="1" />
            <rect x="8" y="12" width="3" height="3" rx="1" />
          </svg>
          <h1 id="startup-title">Opening your workspace…</h1>
          <p id="startup-status"></p>
          <button id="startup-retry" type="button">
            <!-- Central Icons: IconArrowRotateClockwise -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M18.5 7.00891C16.6791 4.95438 14.7962 3.75 11.979 3.75C7.42266 3.75 3.729 7.44365 3.729 12C3.729 16.5563 7.42266 20.25 11.979 20.25C15.5711 20.25 18.627 17.9543 19.7596 14.75M19.25 4V8H15.25"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Try again
          </button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
