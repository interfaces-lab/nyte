<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nyte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @layer base;

      /*
       * Main shows the window at the interface's first frame, so nothing
       * paints here first. Before boot.ts applies the stored theme on
       * <html>, the color scheme follows the OS.
       */
      html {
        color-scheme: light dark;
      }
      html[data-display-mode="light"] {
        color-scheme: light;
      }
      html[data-display-mode="dark"] {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
