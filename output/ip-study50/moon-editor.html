<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Nyte · Cloud and moon</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #eeeee9;
      color: #25283a;
      font: 14px system-ui;
      margin: 0;
    }
    main {
      max-width: 1280px;
      padding: 32px;
      margin: auto;
    }
    a {
      color: inherit;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    p {
      color: #696b76;
      line-height: 1.5;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 48px;
      margin-top: 28px;
    }
    #hero {
      max-width: 530px;
      margin: auto;
    }
    #hero svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .sizes {
      display: flex;
      align-items: end;
      gap: 24px;
      justify-content: center;
      margin: 24px 0;
    }
    .sizes svg {
      display: block;
    }
    .sizes span {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #696b76;
      margin-top: 8px;
    }
    aside {
      background: #fafaf7;
      padding: 24px;
      border-radius: 14px;
    }
    label {
      display: block;
      margin-bottom: 18px;
    }
    label span {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    input[type="range"],
    select {
      width: 100%;
      accent-color: #637db9;
    }
    select,
    button {
      font: inherit;
      padding: 9px;
      border: 1px solid #d4d5ce;
      background: #fafaf7;
      border-radius: 7px;
      color: inherit;
    }
    input[type="color"] {
      width: 100%;
      height: 32px;
      border: 0;
      padding: 0;
      background: none;
    }
    .colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
      margin-top: 32px;
    }
    .gallery button {
      padding: 8px;
      text-align: left;
      cursor: pointer;
    }
    .gallery svg {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }
    .gallery button[aria-pressed="true"] {
      outline: 2px solid #637db9;
    }
    .ref {
      display: flex;
      gap: 18px;
      margin-top: 30px;
    }
    .ref img {
      width: 100px;
    }
    .ref p {
      font-size: 12px;
    }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #637db9;
      outline-offset: 4px;
    }
    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
      main {
        padding: 20px;
      }
    }
  </style>
  <main>
    <a href="./">← The 12 character studies</a>
    <h1>Cloud meets moon.</h1>
    <p>
      D1 and D2 redrawn as editable vectors. Move the moon, tune its color, and turn the light. Set
      moon fullness to 100 for a circle.
    </p>
    <div class="gallery" id="presets"></div>
    <div class="layout">
      <section>
        <div id="hero"></div>
        <div class="sizes" id="sizes"></div>
        <div class="buttons">
          <button id="svg">Download SVG</button><button id="png">Download 4096 px PNG</button
          ><button id="reset">Reset study</button>
        </div>
        <div class="ref">
          <div>
            <img src="D1.png" alt="Original generated D1" />
            <p>D1 reference</p>
          </div>
          <div>
            <img src="D2.png" alt="Original generated D2" />
            <p>D2 reference</p>
          </div>
        </div>
      </section>
      <aside>
        <label
          ><span>Cloud silhouette</span
          ><select id="shape">
            <option>D1</option>
            <option>D2</option>
          </select></label
        ><label
          ><span>Moon placement</span
          ><select id="mode">
            <option value="none">No moon</option>
            <option value="behind">Behind the cloud</option>
            <option value="cheek">Crescent cheek</option>
          </select></label
        >
        <div class="colors" id="colors"></div>
        <div id="ranges"></div>
      </aside>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script type="module">
    import { defaults, presets, render } from "./cloud-vector.mjs";
    let selected = 2,
      s = { ...defaults, ...presets[selected][1] };
    try {
      const saved = JSON.parse(localStorage.getItem("nyte-d-cloud-moon"));
      if (saved) {
        selected = saved.selected;
        s = { ...s, ...saved.s };
      }
    } catch {}
    const $ = (id) => document.getElementById(id);
    const ranges = [
      ["x", "Moon horizontal", 0, 512],
      ["y", "Moon vertical", 0, 512],
      ["radius", "Moon size", 16, 140],
      ["phase", "Moon fullness", 0, 100],
      ["turn", "Moon rotation", -180, 180],
      ["light", "Light direction", 0, 360],
      ["depth", "Cloud elevation", 0, 40],
      ["round", "Tile corner radius", 0, 120],
    ];
    for (const [k, title] of [
      ["bg", "Background"],
      ["cloud", "Cloud"],
      ["under", "Underside"],
      ["eyes", "Eyes"],
      ["moon", "Moon"],
    ]) {
      $("colors").insertAdjacentHTML(
        "beforeend",
        `<label><span>${title}</span><input type="color" id="${k}" aria-label="${title}"></label>`,
      );
    }
    for (const [k, title, min, max] of ranges) {
      $("ranges").insertAdjacentHTML(
        "beforeend",
        `<label><span>${title}<output id="${k}Value"></output></span><input type="range" id="${k}" min="${min}" max="${max}" aria-label="${title}"></label>`,
      );
    }
    presets.forEach(([name, p], i) => {
      const b = document.createElement("button");
      b.innerHTML = render({ ...defaults, ...p }, "preset" + i, 160) + name;
      b.onclick = () => {
        selected = i;
        s = { ...defaults, ...p };
        sync();
      };
      $("presets").append(b);
    });
    function draw() {
      $("hero").innerHTML = render(s, "hero");
      $("sizes").innerHTML = [128, 64, 32, 16]
        .map((n) => `<div>${render(s, "s" + n, n)}<span>${n}px</span></div>`)
        .join("");
      for (const [k] of ranges) $(k + "Value").textContent = s[k];
      [...$("presets").children].forEach((b, i) => b.setAttribute("aria-pressed", i === selected));
      try {
        localStorage.setItem("nyte-d-cloud-moon", JSON.stringify({ selected, s }));
      } catch {}
    }
    function sync() {
      for (const [k, v] of Object.entries(s)) if ($(k)) $(k).value = v;
      draw();
    }
    for (const k of Object.keys(defaults)) {
      if ($(k))
        $(k).oninput = (e) => {
          s[k] = typeof defaults[k] === "number" ? Number(e.target.value) : e.target.value;
          draw();
        };
    }
    function save(blob, name) {
      const url = URL.createObjectURL(blob),
        a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    $("svg").onclick = () =>
      save(
        new Blob([render(s, "nyte", 4096)], { type: "image/svg+xml" }),
        `nyte-${s.shape}-moon.svg`,
      );
    $("png").onclick = async () => {
      const b = $("png");
      b.disabled = true;
      $("status").textContent = "Rendering 4096 px PNG…";
      try {
        const blob = new Blob([render(s, "nyte", 4096)], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.src = url;
        await img.decode();
        const c = document.createElement("canvas");
        c.width = c.height = 4096;
        c.getContext("2d").drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const png = await new Promise((r) => c.toBlob(r, "image/png"));
        save(png, `nyte-${s.shape}-moon-4096.png`);
        $("status").textContent = "4096 px PNG exported.";
      } catch {
        $("status").textContent = "PNG export failed. The SVG download is still available.";
      } finally {
        b.disabled = false;
      }
    };
    $("reset").onclick = () => {
      s = { ...defaults, ...presets[selected][1] };
      sync();
    };
    sync();
  </script>
</html>
