<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="Nyte cropped cloud app icon">
  <defs>
    <clipPath id="nyte-tile"><path d="M 132 16 H 380 C 454 16 496 58 496 132 V 380 C 496 454 454 496 380 496 H 132 C 58 496 16 454 16 380 V 132 C 16 58 58 16 132 16 Z"/></clipPath>
    <clipPath id="nyte-cloud"><path d="M -20 550 V 220 C -20 142 17 104 65 104 C 103 104 132 126 164 172 L 342 393 V 180 C 342 132 378 106 423 106 C 477 106 521 151 521 207 V 550 H 401 L 161 257 V 550 Z" transform="translate(0 0) translate(256 256) scale(1) translate(-256 -256)"/></clipPath>
    
    <pattern id="nyte-dots" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="2.5" cy="2.5" r="1.25" fill="#222324"/></pattern>
    <linearGradient id="nyte-dot-fade" gradientUnits="userSpaceOnUse" x1="437.0193359837562" y1="74.9806640162438" x2="74.98066401624386" y2="437.0193359837562"><stop stop-color="white" stop-opacity=".04"/><stop offset=".38" stop-color="white" stop-opacity=".16"/><stop offset="1" stop-color="white"/></linearGradient>
    <radialGradient id="nyte-corner" gradientUnits="userSpaceOnUse" cx="35" cy="491" r="325"><stop stop-color="white"/><stop offset=".3" stop-color="white" stop-opacity=".9"/><stop offset=".7" stop-color="white" stop-opacity=".23"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
    <mask id="nyte-screen" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="url(#nyte-dot-fade)"/></mask>
    <mask id="nyte-cut" maskUnits="userSpaceOnUse" x="-256" y="-256" width="1024" height="1280"><rect x="-256" y="-256" width="1024" height="1280" fill="white"/></mask>
    <linearGradient id="nyte-tone" gradientUnits="userSpaceOnUse" x1="437.0193359837562" y1="74.9806640162438" x2="74.98066401624386" y2="437.0193359837562">
      <stop stop-color="#f0e748"/><stop offset=".4" stop-color="#f0e748"/><stop offset="1" stop-color="#d2c83e"/>
    </linearGradient>
    <linearGradient id="nyte-rim" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".025"/><stop offset="1" stop-color="#000" stop-opacity=".13"/></linearGradient>
    <filter id="nyte-base-shadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".15"/>
    </filter>
    <filter id="nyte-edge" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="6.3" dy="-5.3999999999999995" stdDeviation="0.35" flood-color="#080b12" flood-opacity="0.7"/>
    </filter>
    <filter id="nyte-worn" filterUnits="userSpaceOnUse" x="-16" y="-16" width="544" height="544" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".11 .24" numOctaves="2" seed="8" result="roughness"/>
      <feDisplacementMap in="SourceGraphic" in2="roughness" scale="0" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0"/>
    </filter>
    <filter id="nyte-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="3" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <path d="M 132 16 H 380 C 454 16 496 58 496 132 V 380 C 496 454 454 496 380 496 H 132 C 58 496 16 454 16 380 V 132 C 16 58 58 16 132 16 Z" fill="#222324" filter="url(#nyte-base-shadow)"/>
  <g clip-path="url(#nyte-tile)">
    
    <g >
    <g fill="#f0e748" filter="url(#nyte-edge)" mask="url(#nyte-cut)"><path d="M -20 550 V 220 C -20 142 17 104 65 104 C 103 104 132 126 164 172 L 342 393 V 180 C 342 132 378 106 423 106 C 477 106 521 151 521 207 V 550 H 401 L 161 257 V 550 Z" transform="translate(0 0) translate(256 256) scale(1) translate(-256 -256)"/></g>
    <g transform="translate(6 -6)" fill="#2777c9" stroke="#2777c9" stroke-width="7" stroke-linejoin="round"><path d="M -20 550 V 220 C -20 142 17 104 65 104 C 103 104 132 126 164 172 L 342 393 V 180 C 342 132 378 106 423 106 C 477 106 521 151 521 207 V 550 H 401 L 161 257 V 550 Z" transform="translate(0 0) translate(256 256) scale(1) translate(-256 -256)"/></g>
    <g  mask="url(#nyte-cut)">
      <g fill="none" stroke="#f5f0de" stroke-width="6" stroke-linejoin="round"><path d="M -20 550 V 220 C -20 142 17 104 65 104 C 103 104 132 126 164 172 L 342 393 V 180 C 342 132 378 106 423 106 C 477 106 521 151 521 207 V 550 H 401 L 161 257 V 550 Z" transform="translate(0 0) translate(256 256) scale(1) translate(-256 -256)"/></g>
      <g fill="#f0e748"><path d="M -20 550 V 220 C -20 142 17 104 65 104 C 103 104 132 126 164 172 L 342 393 V 180 C 342 132 378 106 423 106 C 477 106 521 151 521 207 V 550 H 401 L 161 257 V 550 Z" transform="translate(0 0) translate(256 256) scale(1) translate(-256 -256)"/></g>
      <g fill="url(#nyte-tone)" opacity="0.05"><path d="M -20 550 V 220 C -20 142 17 104 65 104 C 103 104 132 126 164 172 L 342 393 V 180 C 342 132 378 106 423 106 C 477 106 521 151 521 207 V 550 H 401 L 161 257 V 550 Z" transform="translate(0 0) translate(256 256) scale(1) translate(-256 -256)"/></g>
    </g>
    <g clip-path="url(#nyte-cloud)" mask="url(#nyte-cut)"><rect width="512" height="512" fill="url(#nyte-dots)" opacity="0.55" mask="url(#nyte-screen)"/></g>
    <g clip-path="url(#nyte-cloud)" mask="url(#nyte-cut)" opacity="0.03"><rect x="0" y="0" width="512" height="512" filter="url(#nyte-grain)" style="mix-blend-mode:multiply"/></g>
    
    
    </g>
    <path d="M 132 16 H 380 C 454 16 496 58 496 132 V 380 C 496 454 454 496 380 496 H 132 C 58 496 16 454 16 380 V 132 C 16 58 58 16 132 16 Z" fill="none" stroke="url(#nyte-rim)" stroke-width="2"/>
  </g>
</svg>