<!doctype html><meta charset="utf-8" /><style>
  body {
    margin: 0;
    width: 1440px;
    height: 900px;
    display: grid;
    grid-template-rows: 1fr 1fr;
    font:
      12px -apple-system,
      system-ui;
    color: #888;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 56px;
    padding: 48px 64px;
  }
  .light {
    background: linear-gradient(#e9ecf2, #d6dbe5);
  }
  .dark {
    background: #0e0f13;
  }
  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  img {
    display: block;
  }
</style>
<div class="row light">
  <figure><img src="nyte-icon-macos.svg" width="512" /></figure>
  <figure><img src="nyte-icon-macos.svg" width="128" /></figure>
  <figure><img src="nyte-icon-macos.svg" width="64" /></figure>
  <figure><img src="nyte-icon-macos.svg" width="32" /></figure>
  <figure><img src="nyte-icon-macos.svg" width="16" /></figure>
</div>
<div class="row dark">
  <figure><img src="nyte-icon-macos.svg" width="256" /></figure>
  <figure><img src="/tmp/ref-icons/Linear.png" width="256" /></figure>
  <figure><img src="/tmp/ref-icons/Cursor.png" width="256" /></figure>
  <figure><img src="/tmp/ref-icons/Ghostty.png" width="256" /></figure>
</div>
