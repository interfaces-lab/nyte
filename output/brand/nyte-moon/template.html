<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>nyte</title>
    <style>
      :root {
        --bg: #0a0c12;
        --ink: #252b3a;
        --ink-soft: #3a4257;
        --amber: #ffc96b;
        --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }
      body {
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
        color: var(--ink-soft);
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
      }
      #cube {
        cursor: grab;
        touch-action: none;
      }
      #cube.dragging {
        cursor: grabbing;
      }
      .ui {
        position: absolute;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
      }
      .authorities {
        top: 24px;
        left: 28px;
        display: flex;
        gap: 20px;
        color: var(--ink-soft);
      }
      .authorities span::before {
        content: "/";
        color: var(--ink);
        margin-right: 6px;
      }
      .wordmark {
        bottom: 28px;
        left: 28px;
      }
      .wordmark .name {
        display: block;
        color: var(--amber);
        font-size: 15px;
        line-height: 20px;
        letter-spacing: 0.55em;
      }
      .wordmark .tag {
        display: block;
        margin-top: 6px;
        color: var(--ink-soft);
      }
      .hint {
        bottom: 28px;
        right: 28px;
        color: var(--ink-soft);
        transition: opacity 1.2s ease;
      }
      .hint.faded {
        opacity: 0;
      }
      @media (max-width: 640px) {
        .authorities {
          gap: 12px;
          left: 20px;
          top: 20px;
        }
        .wordmark {
          left: 20px;
          bottom: 24px;
        }
        .hint {
          right: 20px;
          top: 20px;
          bottom: auto;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="code"></canvas>
    <canvas id="cube"></canvas>
    <div class="ui authorities" aria-hidden="true">
      <span>objects</span><span>refs</span><span>leases</span><span>events</span>
    </div>
    <div class="ui wordmark">
      <span class="name">nyte</span><span class="tag">durable runtime for agent conversations</span>
    </div>
    <div class="ui hint" id="hint">drag to rotate</div>
    <script type="module">
      __PRETEXT__(async () => {
        const { prepareWithSegments, layoutWithLines } = __pretext;
        const SOURCE = __SOURCE__;

        // Grid ------------------------------------------------------------------
        const FONT_SIZE = 13;
        const FONT = `${FONT_SIZE}px "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace`;
        const BG = "#0a0c12";
        const CODE_INK = "#232938";
        const RAMP = " .:-=+*#%@";
        // Dawn on night: three amber stops, dark to hot.
        const STOPS = [
          [
            [0x5a, 0x3e, 0x18],
            [0xff, 0xc9, 0x6b],
            [0xff, 0xf3, 0xdc],
          ], // the moon
          [
            [0x20, 0x28, 0x40],
            [0x4a, 0x5e, 0x8c],
            [0xa4, 0xb6, 0xd8],
          ], // the night
        ];
        const LEVELS = 32;
        const COLORS = STOPS.map((stops) =>
          Array.from({ length: LEVELS }, (_, i) => {
            const t = i / (LEVELS - 1);
            const [a, b, k] =
              t < 0.5 ? [stops[0], stops[1], t * 2] : [stops[1], stops[2], (t - 0.5) * 2];
            const c = a.map((v, j) => Math.round(v + (b[j] - v) * k));
            return `rgb(${c[0]},${c[1]},${c[2]})`;
          }),
        );

        const codeCanvas = document.getElementById("code");
        const cubeCanvas = document.getElementById("cube");
        const codeCtx = codeCanvas.getContext("2d");
        const cubeCtx = cubeCanvas.getContext("2d");
        const hint = document.getElementById("hint");

        let W = 0,
          H = 0,
          dpr = 1,
          cellW = 8,
          cellH = 16,
          cols = 0,
          rows = 0,
          originX = 0,
          originY = 0;
        let prepared = null;

        await document.fonts.ready;

        function measure() {
          codeCtx.font = FONT;
          cellW = codeCtx.measureText("M").width;
          cellH = Math.round(FONT_SIZE * 1.25);
        }

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          for (const c of [codeCanvas, cubeCanvas]) {
            c.width = Math.round(W * dpr);
            c.height = Math.round(H * dpr);
            c.style.width = W + "px";
            c.style.height = H + "px";
          }
          measure();
          const padX = 28,
            padTop = 64,
            padBottom = 96;
          cols = Math.floor((W - padX * 2) / cellW);
          rows = Math.floor((H - padTop - padBottom) / cellH);
          originX = (W - cols * cellW) / 2;
          originY = padTop + (H - padTop - padBottom - rows * cellH) / 2;
          drawCode();
        }

        // Background: kernel source, wrapped by pretext to the grid width ---------
        function drawCode() {
          if (prepared === null)
            prepared = prepareWithSegments(SOURCE, FONT, { whiteSpace: "pre-wrap" });
          const { lines } = layoutWithLines(prepared, cols * cellW - 0.5, cellH);
          const ctx = codeCtx;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = BG;
          ctx.fillRect(0, 0, W, H);
          ctx.font = FONT;
          ctx.textBaseline = "middle";
          ctx.fillStyle = CODE_INK;
          const n = lines.length;
          for (let r = 0; r < rows; r++) {
            const line = lines[r % n];
            if (line === undefined || line.text.length === 0) continue;
            ctx.fillText(line.text, originX, originY + (r + 0.5) * cellH);
          }
          // Let the code fall away toward the cube so the mark holds the centre.
          const g = ctx.createRadialGradient(
            W / 2,
            cubeCenterY(),
            0,
            W / 2,
            cubeCenterY(),
            Math.max(W, H) * 0.42,
          );
          g.addColorStop(0, "rgba(10,12,18,0.82)");
          g.addColorStop(1, "rgba(10,12,18,0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }

        function cubeCenterY() {
          return originY + (rows / 2 - 1) * cellH;
        }

        // Geometry: the moon, nine cells across. Every cell is a unit; the sphere
        // is the set of cells whose centre lies within the radius. -----------------
        const N = 9;
        const HALF_N = N / 2;
        const SPHERE_R = 4.45;
        const VOX = new Uint8Array(N * N * N);
        for (let i = 0; i < N; i++)
          for (let j = 0; j < N; j++)
            for (let k = 0; k < N; k++) {
              const x = i + 0.5 - HALF_N,
                y = j + 0.5 - HALF_N,
                z = k + 0.5 - HALF_N;
              if (x * x + y * y + z * z <= SPHERE_R * SPHERE_R) VOX[(i * N + j) * N + k] = 1;
            }
        const RADIUS = 5.2;

        // March the grid one cell at a time. Returns the hit point and the face
        // entered, or null when the ray leaves the grid without touching a cell.
        function traverse(ro, rd) {
          let tmin = -Infinity,
            tmax = Infinity,
            enterAxis = -1;
          for (let a = 0; a < 3; a++) {
            const inv = 1 / rd[a];
            let t0 = (-HALF_N - ro[a]) * inv,
              t1 = (HALF_N - ro[a]) * inv;
            if (t0 > t1) {
              const tmp = t0;
              t0 = t1;
              t1 = tmp;
            }
            if (t0 > tmin) {
              tmin = t0;
              enterAxis = a;
            }
            if (t1 < tmax) tmax = t1;
            if (tmin > tmax) return null;
          }
          if (tmax < 0) return null;
          let t = Math.max(tmin, 0) + 1e-5;
          const p = [ro[0] + rd[0] * t, ro[1] + rd[1] * t, ro[2] + rd[2] * t];
          const idx = [0, 0, 0],
            step = [0, 0, 0],
            tMax = [0, 0, 0],
            tDelta = [0, 0, 0];
          for (let a = 0; a < 3; a++) {
            idx[a] = Math.min(N - 1, Math.max(0, Math.floor(p[a] + HALF_N)));
            step[a] = rd[a] > 0 ? 1 : -1;
            tDelta[a] = Math.abs(1 / rd[a]);
            const edge = rd[a] > 0 ? idx[a] + 1 - HALF_N : idx[a] - HALF_N;
            tMax[a] = t + (edge - p[a]) / rd[a];
          }
          let axis = enterAxis;
          for (let n = 0; n < 3 * N + 2; n++) {
            if (VOX[(idx[0] * N + idx[1]) * N + idx[2]]) {
              const nrm = [0, 0, 0];
              nrm[axis] = -step[axis];
              return { t, nrm };
            }
            axis = tMax[0] < tMax[1] ? (tMax[0] < tMax[2] ? 0 : 2) : tMax[1] < tMax[2] ? 1 : 2;
            t = tMax[axis];
            idx[axis] += step[axis];
            if (idx[axis] < 0 || idx[axis] >= N) return null;
            tMax[axis] += tDelta[axis];
          }
          return null;
        }

        // Camera / rotation ------------------------------------------------------
        let yaw = 0.3,
          pitch = 0.25,
          vyaw = 0,
          vpitch = 0;
        let dragging = false,
          lastX = 0,
          lastY = 0,
          lastT = 0,
          lastFrame = performance.now();
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const AUTO_RATE = (Math.PI * 2) / 51; // one turn every 51 seconds

        function viewToObject(yaw, pitch) {
          // view = Rx(pitch) * Ry(yaw) * object   =>   object = Ry(-yaw) * Rx(-pitch) * view
          const cy = Math.cos(yaw),
            sy = Math.sin(yaw),
            cp = Math.cos(pitch),
            sp = Math.sin(pitch);
          // Rx(-pitch)
          const a = [1, 0, 0, 0, cp, sp, 0, -sp, cp];
          // Ry(-yaw)
          const b = [cy, 0, -sy, 0, 1, 0, sy, 0, cy];
          const m = new Array(9);
          for (let i = 0; i < 3; i++)
            for (let j = 0; j < 3; j++) {
              m[i * 3 + j] = b[i * 3] * a[j] + b[i * 3 + 1] * a[3 + j] + b[i * 3 + 2] * a[6 + j];
            }
          return m;
        }
        function mul(m, x, y, z) {
          return [
            m[0] * x + m[1] * y + m[2] * z,
            m[3] * x + m[4] * y + m[5] * z,
            m[6] * x + m[7] * y + m[8] * z,
          ];
        }
        function norm(v) {
          const l = Math.hypot(v[0], v[1], v[2]);
          return [v[0] / l, v[1] / l, v[2] / l];
        }
        // The sun sits to the right and a little behind: a waxing crescent.
        const KEY = norm([0.8, 0.3, -0.3]);
        const FILL = norm([-0.4, 0.5, 0.75]);

        const hits = { x: [], y: [], ch: [], col: [] };

        function render() {
          const ctx = cubeCtx;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);
          ctx.font = FONT;
          ctx.textBaseline = "middle";

          const aspect = cellW / cellH;
          const S = Math.min(rows * 0.33, cols * aspect * 0.38) / RADIUS; // rows per world unit
          const cx = cols / 2,
            cy = rows / 2 - 1;
          const reach = RADIUS * S;
          const r0 = Math.max(0, Math.floor(cy - reach)),
            r1 = Math.min(rows - 1, Math.ceil(cy + reach));
          const c0 = Math.max(0, Math.floor(cx - reach / aspect)),
            c1 = Math.min(cols - 1, Math.ceil(cx + reach / aspect));

          const M = viewToObject(yaw, pitch);
          const D = 34; // camera distance: almost orthographic, still a logo
          const ro = mul(M, 0, 0, D);
          const key = mul(M, KEY[0], KEY[1], KEY[2]);
          const fill = mul(M, FILL[0], FILL[1], FILL[2]);
          const eye = mul(M, 0, 0, 1);

          hits.x.length = hits.y.length = hits.ch.length = hits.col.length = 0;

          for (let r = r0; r <= r1; r++) {
            const wy = -(r + 0.5 - cy) / S;
            for (let c = c0; c <= c1; c++) {
              const wx = ((c + 0.5 - cx) * aspect) / S;
              const rd = mul(M, wx / D, wy / D, -1);
              {
                const l = Math.hypot(rd[0], rd[1], rd[2]);
                rd[0] /= l;
                rd[1] /= l;
                rd[2] /= l;
              }
              const hit = traverse(ro, rd);
              if (hit === null) continue;
              const px = ro[0] + rd[0] * hit.t,
                py = ro[1] + rd[1] * hit.t,
                pz = ro[2] + rd[2] * hit.t;
              const nf = hit.nrm;
              const pl = Math.hypot(px, py, pz) || 1;
              const ns = [px / pl, py / pl, pz / pl];

              // The phase comes from the sphere. The cells show through as facets:
              // faces that meet the eye are brighter than faces seen on edge.
              const sun = Math.max(0, ns[0] * key[0] + ns[1] * key[1] + ns[2] * key[2]);
              const facet = Math.max(0, nf[0] * eye[0] + nf[1] * eye[1] + nf[2] * eye[2]);
              const shine = Math.max(0, nf[0] * fill[0] + nf[1] * fill[1] + nf[2] * fill[2]);
              let b = 0.05 + Math.pow(sun, 0.5) * (0.68 + 0.32 * facet) + 0.05 * shine;
              const mat = sun > 0.02 ? 0 : 1; // night side is earthshine, in night blue
              b = Math.min(1, Math.max(0, b));
              const gi = Math.max(1, Math.round(b * (RAMP.length - 1)));
              hits.x.push(originX + c * cellW);
              hits.y.push(originY + r * cellH);
              hits.ch.push(RAMP[gi]);
              hits.col.push(mat * LEVELS + Math.round(b * (LEVELS - 1)));
            }
          }

          // The cube is solid: it occludes the code beneath it.
          ctx.fillStyle = BG;
          for (let i = 0; i < hits.x.length; i++)
            ctx.fillRect(hits.x[i], hits.y[i], cellW + 0.5, cellH + 0.5);
          for (let level = 0; level < LEVELS * 2; level++) {
            let set = false;
            for (let i = 0; i < hits.x.length; i++) {
              if (hits.col[i] !== level) continue;
              if (!set) {
                ctx.fillStyle = COLORS[level >= LEVELS ? 1 : 0][level % LEVELS];
                set = true;
              }
              ctx.fillText(hits.ch[i], hits.x[i], hits.y[i] + cellH / 2);
            }
          }
        }

        function frame(now) {
          const dt = Math.min(0.05, (now - lastFrame) / 1000);
          lastFrame = now;
          if (!dragging) {
            yaw += vyaw;
            pitch += vpitch;
            vyaw *= 0.94;
            vpitch *= 0.94;
            if (!reduceMotion && Math.abs(vyaw) < 0.0005) yaw += AUTO_RATE * dt;
            pitch = Math.max(-1.3, Math.min(1.3, pitch));
          }
          render();
          requestAnimationFrame(frame);
        }

        // Drag to rotate ---------------------------------------------------------
        cubeCanvas.addEventListener("pointerdown", (e) => {
          dragging = true;
          vyaw = vpitch = 0;
          lastX = e.clientX;
          lastY = e.clientY;
          lastT = performance.now();
          cubeCanvas.setPointerCapture(e.pointerId);
          cubeCanvas.classList.add("dragging");
          hint.classList.add("faded");
        });
        cubeCanvas.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - lastX,
            dy = e.clientY - lastY;
          const now = performance.now(),
            dt = Math.max(1, now - lastT);
          yaw += dx * 0.008;
          pitch += dy * 0.008;
          pitch = Math.max(-1.3, Math.min(1.3, pitch));
          vyaw = dx * 0.008 * (16 / dt);
          vpitch = dy * 0.008 * (16 / dt);
          lastX = e.clientX;
          lastY = e.clientY;
          lastT = now;
        });
        const release = () => {
          dragging = false;
          cubeCanvas.classList.remove("dragging");
        };
        cubeCanvas.addEventListener("pointerup", release);
        cubeCanvas.addEventListener("pointercancel", release);
        window.addEventListener("keydown", (e) => {
          const step = 0.12;
          if (e.key === "ArrowLeft") yaw -= step;
          else if (e.key === "ArrowRight") yaw += step;
          else if (e.key === "ArrowUp") pitch -= step;
          else if (e.key === "ArrowDown") pitch += step;
          else return;
          hint.classList.add("faded");
        });

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
