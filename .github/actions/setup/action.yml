name: Set up Nyte
description: Install Node, pnpm and the workspace, with optional Bun and test dependencies.

inputs:
  bun:
    description: Install Bun
    default: "false"
  test-dependencies:
    description: Install ripgrep, a git identity, and on Linux Xvfb and Chromium's system libraries
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    # On Linux one sticky disk holds the store and the virtual store: pnpm hardlinks only
    # within one filesystem, and a warm virtual store makes install a relink.
    - if: runner.os == 'Linux'
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-pnpm-${{ runner.arch }}
        path: ~/pnpm
        commit: on-change
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "pnpm_config_store_dir=$HOME/pnpm/store" >> "$GITHUB_ENV"
        echo "pnpm_config_virtual_store_dir=$HOME/pnpm/virtual" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: ${{ runner.os != 'Linux' && 'pnpm' || '' }}
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.test-dependencies == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep xvfb
        pnpm --dir packages/app exec playwright install-deps chromium
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - if: inputs.test-dependencies == 'true' && runner.os == 'macOS'
      shell: bash
      run: command -v rg || brew install ripgrep
    - if: inputs.test-dependencies == 'true' && runner.os == 'Windows'
      shell: bash
      run: command -v rg || choco install ripgrep -y --no-progress
    - if: inputs.test-dependencies == 'true'
      shell: bash
      run: |
        git config --global user.email "ci@nyte.sh"
        git config --global user.name "nyte-ci"
