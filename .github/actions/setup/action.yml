name: Set up Nyte
description: Install Node, pnpm, Go and the workspace, with optional Bun and test dependencies.

inputs:
  bun:
    description: Install Bun
    default: "false"
  test-dependencies:
    description: Install ripgrep, a git identity, and on Linux Xvfb and Chromium's system libraries
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - uses: actions/setup-go@v6
      with:
        go-version-file: packages/tailnet/go.mod
        cache-dependency-path: packages/tailnet/go.sum
    # setup-bun's bun-version-file does not read mise.toml.
    - id: bun
      if: inputs.bun == 'true'
      shell: bash
      run: |
        version=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)
        [ -n "$version" ] || { echo "::error::mise.toml has no bun = \"<version>\" line."; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun.outputs.version }}
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.test-dependencies == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep xvfb
        pnpm --dir packages/app exec playwright install-deps chromium
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - if: inputs.test-dependencies == 'true' && runner.os == 'macOS'
      shell: bash
      run: command -v rg || brew install ripgrep
    - if: inputs.test-dependencies == 'true'
      shell: bash
      run: |
        git config --global user.email "ci@nyte.sh"
        git config --global user.name "nyte-ci"
