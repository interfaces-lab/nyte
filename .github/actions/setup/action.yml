name: Set up Nyte
description: Install Node, pnpm and the workspace, with optional Bun and test dependencies.

inputs:
  bun:
    description: Install Bun
    default: "false"
  test-dependencies:
    description: Install ripgrep, a git identity, and on Linux Xvfb and Chromium's system libraries
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.test-dependencies == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep xvfb
        pnpm --dir packages/app exec playwright install-deps chromium
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - if: inputs.test-dependencies == 'true' && runner.os == 'macOS'
      shell: bash
      run: command -v rg || brew install ripgrep
    - if: inputs.test-dependencies == 'true' && runner.os == 'Windows'
      shell: bash
      run: command -v rg || choco install ripgrep -y --no-progress
    - if: inputs.test-dependencies == 'true'
      shell: bash
      run: |
        git config --global user.email "ci@nyte.sh"
        git config --global user.name "nyte-ci"
