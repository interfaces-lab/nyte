name: Changesets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}

jobs:
  status:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since="origin/$GITHUB_BASE_REF"

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: mode
        uses: changesets/action/select-mode@v2.1.2
      - if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - id: release
        if: steps.mode.outputs.mode != 'version'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          draft=$(RELEASE_TAG="v$version" gh api "repos/$GH_REPO/releases?per_page=100" --jq 'map(select(.tag_name == env.RELEASE_TAG)) | first | .draft')
          if [[ "$draft" != false ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.release != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.release }}
    secrets: inherit
