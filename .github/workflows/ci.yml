name: CI

on:
  pull_request:
  push:
    branches: [release/**]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# GitHub-hosted runners are free for this public repository; Blacksmith bills per minute, so
# only release builds use it. Pushes to main don't run CI: pull requests test what they
# change, and the nightly run tests everything on main, on macOS as well.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      filter: ${{ steps.plan.outputs.filter }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Plan the test jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          filter="--affected"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then filter=""; fi
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          pnpm exec turbo ls $filter --output=json > "$RUNNER_TEMP/packages.json"
          node -e '
            const { packages } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const names = new Set(packages.items.map((item) => item.name));
            console.error(`${packages.count} packages: ${[...names].join(" ")}`);
            console.log(`web=${names.has("@nyte-ai/app")}`);
            console.log(`desktop=${names.has("@nyte-ai/desktop")}`);
            const { EVENT, REF } = process.env;
            const include = [
              { os: "linux", runner: "ubuntu-latest" },
              { os: "windows", runner: "windows-latest" },
            ];
            if (EVENT === "schedule" || EVENT === "workflow_dispatch" || (EVENT === "push" && REF.startsWith("refs/heads/release/"))) {
              include.push({ os: "macos", runner: "macos-latest" });
            }
            console.log(`unit_matrix=${JSON.stringify({ include })}`);
          ' "$RUNNER_TEMP/packages.json" >> "$GITHUB_OUTPUT"
      - run: pnpm sdk:check
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck

  binary:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - run: pnpm build
      - run: pnpm --dir packages/tui verify:targets
      - name: Verify compiled binary and service lifecycle
        run: pnpm --dir packages/tui test:binary

  unit:
    name: unit (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.unit_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          test-dependencies: "true"
      - name: Run unit tests
        timeout-minutes: 35
        env:
          FILTER: ${{ needs.check.outputs.filter }}
        run: |
          display=""
          if [ "$RUNNER_OS" = Linux ]; then display="xvfb-run --auto-servernum"; fi
          $display pnpm exec turbo run test $FILTER --concurrency=3 --continue

  # Its tests take seconds; setup takes a minute, so one job runs both projects.
  # `timed` depends on `web` in the config, so it runs afterwards on one worker.
  e2e-web:
    name: e2e web
    needs: check
    if: needs.check.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          test-dependencies: "true"
      - run: pnpm --dir packages/app exec playwright install chromium
      - run: pnpm --dir packages/canvas build
      - run: pnpm --dir packages/app build
      - name: Run web e2e against the built app
        run: |
          export NYTE_WATERFALL_DIR="$PWD/packages/app/e2e/test-results/waterfall"
          pnpm --dir packages/app exec playwright test --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-web-${{ github.run_attempt }}
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
          retention-days: 7

  e2e-desktop:
    name: e2e desktop (${{ matrix.shard }})
    needs: check
    if: needs.check.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          test-dependencies: "true"
      - run: pnpm --dir packages/desktop exec playwright install chromium
      - name: Build the app and run desktop e2e against it
        run: xvfb-run --auto-servernum pnpm --dir packages/desktop e2e --shard=${{ matrix.shard }} --grep-invert "polish evidence"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-desktop-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            packages/desktop/e2e/test-results
            packages/desktop/e2e/playwright-report
          retention-days: 7
