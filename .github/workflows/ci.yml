name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, release/**]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      filter: ${{ steps.plan.outputs.filter }}
      tests: ${{ steps.plan.outputs.tests }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      sdk: ${{ steps.plan.outputs.sdk }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Plan the test jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          filter="--affected"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = merge_group ]; then filter=""; fi
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          pnpm exec turbo ls $filter --output=json > "$RUNNER_TEMP/packages.json"
          node -e '
            const { packages } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const names = new Set(packages.items.map((item) => item.name));
            console.error(`${packages.count} packages: ${[...names].join(" ")}`);
            const { EVENT, REF } = process.env;
            const tests = !(EVENT === "push" && REF === "refs/heads/main");
            console.log(`tests=${tests}`);
            console.log(`web=${tests && names.has("@nyte-ai/app")}`);
            console.log(`desktop=${tests && EVENT !== "pull_request" && names.has("@nyte-ai/desktop")}`);
            console.log(`sdk=${tests && names.has("@nyte-ai/sdk")}`);
            const include = [{ os: "linux", runner: "ubuntu-latest" }];
            if (EVENT === "schedule" || EVENT === "workflow_dispatch" || (EVENT === "push" && REF.startsWith("refs/heads/release/"))) {
              include.push({ os: "macos", runner: "macos-latest" });
            }
            console.log(`unit_matrix=${JSON.stringify({ include })}`);
          ' "$RUNNER_TEMP/packages.json" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - run: pnpm sdk:check
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm operations
      # New Go advisories land without a code change, so check them daily rather than per PR.
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm --dir packages/tailnet vulncheck

  binary:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - run: pnpm build
      - run: pnpm --dir packages/tui verify:targets
      - name: Verify compiled binary and service lifecycle
        run: pnpm --dir packages/tui test:binary

  unit:
    name: unit (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          test-dependencies: "true"
          browsers: chromium-headless-shell
      - name: Run unit tests
        timeout-minutes: 35
        env:
          FILTER: ${{ needs.plan.outputs.filter }}
        run: |
          display=""
          if [ "$RUNNER_OS" = Linux ]; then display="xvfb-run --auto-servernum"; fi
          $display pnpm exec turbo run test $FILTER --concurrency=3 --continue

  e2e-web:
    name: e2e web
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "false"
          test-dependencies: "true"
          browsers: chromium
      - run: pnpm --dir packages/canvas build
      - run: pnpm --dir packages/app build
      - name: Run web e2e against the built app
        run: |
          export NYTE_WATERFALL_DIR="$PWD/packages/app/e2e/test-results/waterfall"
          pnpm --dir packages/app exec playwright test --config e2e/playwright.config.ts --grep-invert @quarantine
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-web-${{ github.run_attempt }}
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
          retention-days: 7

  sdk:
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - run: pnpm sdk:pack
      - run: pnpm sdk:verify

  desktop-build:
    name: desktop build
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - run: pnpm --dir packages/canvas build
      - run: pnpm --dir packages/app build
      - run: pnpm --dir packages/tui build
      - run: pnpm --dir packages/desktop build
      - run: pnpm --dir packages/desktop build:e2e
      - run: >-
          tar -czf "$RUNNER_TEMP/desktop-e2e.tgz"
          packages/canvas/dist packages/app/dist packages/tui/dist
          packages/desktop/out packages/desktop/out-e2e packages/desktop/resources
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-e2e.tgz
          retention-days: 1

  e2e-desktop:
    name: e2e desktop (${{ matrix.shard }})
    needs: [plan, desktop-build]
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "false"
          bun: "true"
          test-dependencies: "true"
          browsers: chromium
      - uses: actions/download-artifact@v7
        with:
          name: desktop-e2e-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/desktop-e2e.tgz"
      - name: Run desktop e2e against the built app
        run: xvfb-run --auto-servernum pnpm --dir packages/desktop exec playwright test --config e2e/playwright.config.ts --shard=${{ matrix.shard }} --grep-invert "polish evidence|@quarantine"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-desktop-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            packages/desktop/e2e/test-results
            packages/desktop/e2e/playwright-report
          retention-days: 7

  quarantine:
    name: quarantined e2e
    needs: plan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "false"
          test-dependencies: "true"
          browsers: chromium
      - run: pnpm --dir packages/canvas build
      - run: pnpm --dir packages/app build
      - run: pnpm --dir packages/app exec playwright test --config e2e/playwright.config.ts --grep @quarantine --pass-with-no-tests

  quarantine-desktop:
    name: quarantined e2e desktop
    needs: [plan, desktop-build]
    if: needs.plan.outputs.desktop == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "false"
          bun: "true"
          test-dependencies: "true"
          browsers: chromium
      - uses: actions/download-artifact@v7
        with:
          name: desktop-e2e-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/desktop-e2e.tgz"
      - run: xvfb-run --auto-servernum pnpm --dir packages/desktop exec playwright test --config e2e/playwright.config.ts --grep @quarantine --pass-with-no-tests
