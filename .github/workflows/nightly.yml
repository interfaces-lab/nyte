name: Nightly

on:
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.nightly.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: nightly
        name: Resolve nightly version
        run: |
          latest=$(git tag --list 'v*' --sort=-creatordate | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -n "$latest" ] && [ "$(git rev-list -n 1 "$latest")" = "$(git rev-parse HEAD)" ]; then
            echo "main has not moved since $latest; skipping."
            exit 0
          fi
          node scripts/release-version.mjs resolve --nightly >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
