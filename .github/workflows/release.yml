name: Release
run-name: Release ${{ inputs.version || inputs.bump }}

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      bump:
        type: string
        default: patch
      release_notes:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the latest stable v<x.y.z> tag, unless version is set
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: The version to release or resume, without the leading v; overrides bump
        type: string
        required: false
      release_notes:
        description: Reviewed notes for the GitHub release and CHANGELOG.md; empty generates them
        type: string
        required: false
      skip_verify:
        description: Skip quality checks and tests for this release
        type: boolean
        default: false

permissions:
  contents: read

# Stable releases share one group, so two bumps never resolve the same version.
concurrency:
  group: release-${{ contains(inputs.version, '-') && inputs.version || 'stable' }}

env:
  CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}

jobs:
  # A stable release builds, tags and publishes the `release: v<version>` commit, which carries the
  # versions and the changelog entry. main is protected, so a GitHub App that may bypass its rules
  # pushes that commit. Prereleases and nightlies release the commit the run started from.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: app
        if: ${{ !contains(inputs.version, '-') }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: resolve
        name: Resolve the release version
        env:
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ -n "$VERSION" ]]; then
            node scripts/release-version.mjs resolve --version "$VERSION" | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/release-version.mjs resolve --bump "${BUMP:-patch}" | tee -a "$GITHUB_OUTPUT"
          fi
      - id: commit
        name: Find or make the release commit
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "sha=$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$RELEASE_VERSION"
          subject="release: $tag [skip ci]"
          # A rerun's checkout pins origin/main to the commit the run started from, before its release commit.
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [[ -z "$sha" ]]; then
            # awk reads to the end: exiting early would kill git log with SIGPIPE, and pipefail fails the step.
            sha=$(git log origin/main --format='%H %s' | awk -v subject="$subject" '!found && substr($0, 42) == subject { print $1; found = 1 }')
          fi
          if [[ -z "$sha" ]]; then
            node scripts/release-version.mjs prepare "$RELEASE_VERSION"
            node scripts/release-version.mjs changelog "$RELEASE_VERSION"
            user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git commit --all --message "$subject"
            if ! git push origin HEAD:main; then
              echo "Pushing $subject to main failed; git says why above. If main moved past $GITHUB_SHA, start the release again." >&2
              exit 1
            fi
            sha=$(git rev-parse HEAD)
          fi
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: version
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NYTE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      VITE_NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      VITE_NYTE_CLERK_PUBLISHABLE_KEY: ${{ vars.NYTE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check account configuration
        env:
          NYTE_CLERK_FRONTEND_API_HOST: ${{ vars.NYTE_CLERK_FRONTEND_API_HOST }}
        run: |
          if [[ -z "$VITE_NYTE_CONNECT_ORIGIN" || -z "$VITE_NYTE_CLERK_PUBLISHABLE_KEY" || -z "$NYTE_CLERK_FRONTEND_API_HOST" ]]; then
            echo "Account repository variables are incomplete; the build would ship without Nyte account sign-in." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Verify release versions
        run: node scripts/release-version.mjs prepare "$RELEASE_VERSION" --check
      - name: Verify release secrets
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CSC_KEY_PASSWORD CSC_LINK; do
            if [[ -z "${!name}" ]]; then
              echo "Required release secret $name is not configured." >&2
              exit 1
            fi
          done
      - name: Install Linux test dependencies
        if: ${{ !inputs.skip_verify }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xvfb
          pnpm --dir packages/app exec playwright install-deps chromium
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - if: ${{ !inputs.skip_verify }}
        run: |
          pnpm sdk:check
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm build
          xvfb-run --auto-servernum pnpm exec turbo run test --concurrency=3 --continue
          pnpm sdk:pack
          pnpm sdk:verify
      - name: Build portable desktop assets
        run: node packages/desktop/scripts/assets.mjs build "$RUNNER_TEMP/desktop-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: build-assets
          path: ${{ runner.temp }}/desktop-assets
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  tui:
    needs: [version, verify]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: linux-x64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NYTE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tui
      - name: Sign and notarize nyte
        if: matrix.target == 'darwin-arm64'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/nyte-signing.keychain-db"
          password=$(openssl rand -hex 24)
          trap 'security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --sign "Developer ID Application" --keychain "$keychain" --options runtime --timestamp --entitlements packages/tui/entitlements.plist packages/tui/dist/nyte
          codesign --verify --strict --verbose=2 packages/tui/dist/nyte
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          ditto -c -k --keepParent packages/tui/dist/nyte "$RUNNER_TEMP/nyte.zip"
          xcrun notarytool submit "$RUNNER_TEMP/nyte.zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notarization.json"
          cat "$RUNNER_TEMP/notarization.json"
          node -e 'const { status } = require(process.argv[1]); if (status !== "Accepted") throw new Error(`Notarization ended ${status}.`);' "$RUNNER_TEMP/notarization.json"
      - run: sh scripts/assemble-release.sh packages/tui/dist/nyte dist ${{ matrix.target }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: tui-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  desktop:
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: mac-arm64
            args: --mac --arm64
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: linux-x64
            args: --linux
          - runner: blacksmith-4vcpu-windows-2025
            target: windows-x64
            args: --win
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NYTE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      CSC_LINK: ${{ matrix.target == 'mac-arm64' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'mac-arm64' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY_ID: ${{ matrix.target == 'mac-arm64' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.target == 'mac-arm64' && secrets.APPLE_API_ISSUER || '' }}
      MAIN_VITE_NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      MAIN_VITE_NYTE_CLERK_PUBLISHABLE_KEY: ${{ vars.NYTE_CLERK_PUBLISHABLE_KEY }}
      MAIN_VITE_NYTE_CLERK_FRONTEND_API_HOST: ${{ vars.NYTE_CLERK_FRONTEND_API_HOST }}
      VITE_NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      VITE_NYTE_CLERK_PUBLISHABLE_KEY: ${{ vars.NYTE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Check account configuration
        shell: bash
        run: |
          if [[ -z "$MAIN_VITE_NYTE_CONNECT_ORIGIN" || -z "$MAIN_VITE_NYTE_CLERK_PUBLISHABLE_KEY" || -z "$MAIN_VITE_NYTE_CLERK_FRONTEND_API_HOST" ]]; then
            echo "Account repository variables are incomplete; the build would ship without Nyte account sign-in." >&2
            exit 1
          fi
      - name: Configure Apple notarization
        if: matrix.target == 'mac-arm64'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_API_KEY_CONTENT" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "macOS release secrets are incomplete." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: build-assets
          path: ${{ runner.temp }}/desktop-assets
      - name: Package desktop with portable assets
        shell: bash
        run: node packages/desktop/scripts/build.mjs --assets "$RUNNER_TEMP/desktop-assets" --package --publish never ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*
            !packages/desktop/dist/*-unpacked/**
            !packages/desktop/dist/mac*/**
            !packages/desktop/dist/builder-*.yml
            !packages/desktop/dist/builder-debug.yml
          if-no-files-found: error

  draft:
    needs: [version, tui, desktop]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{tui,desktop}-*"
          path: release
          merge-multiple: true
      - name: Upload the binaries to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(release/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were produced." >&2
            exit 1
          fi
          draft=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq 'map(select(.tag_name == env.RELEASE_TAG)) | first | .draft')
          if [[ "$draft" == false ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            exit 0
          fi
          if [[ "$draft" == true ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" --draft --prerelease="$PRERELEASE" --target "$RELEASE_SHA" --generate-notes --title "Nyte $RELEASE_TAG"

  publish:
    needs: [version, verify, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
      NPM_TAG: ${{ contains(needs.version.outputs.version, '-nightly.') && 'nightly' || contains(needs.version.outputs.version, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Write the release version into the packages
        run: node scripts/release-version.mjs prepare "$RELEASE_VERSION"
      - name: Use the bootstrap npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
      - name: Publish the SDK packages
        run: pnpm release:publish --tag "$NPM_TAG" --filter='!nyte-ai'
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          notes=()
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false "${notes[@]}"
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest "${notes[@]}"
          fi
      - name: Publish the launcher
        run: pnpm release:publish --tag "$NPM_TAG" --filter=nyte-ai
