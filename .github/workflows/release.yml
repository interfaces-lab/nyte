name: Release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The version to release or resume, without the leading v
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}

env:
  CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}
  PRERELEASE: ${{ contains(inputs.version, '-') }}
  NPM_TAG: ${{ contains(inputs.version, '-') && 'next' || 'latest' }}

jobs:
  verify:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: turbo-release-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Verify release versions
        run: |
          node <<'NODE'
          const { globSync, readFileSync } = require("node:fs");
          const [group] = JSON.parse(readFileSync(".changeset/config.json", "utf8")).fixed;
          const versions = new Map(
            globSync("packages/*/package.json")
              .map((file) => JSON.parse(readFileSync(file, "utf8")))
              .map((manifest) => [manifest.name, manifest.version]),
          );
          const behind = group.filter((name) => versions.get(name) !== process.env.RELEASE_VERSION);
          if (behind.length > 0) {
            throw new Error(`${behind.join(", ")} must be at ${process.env.RELEASE_VERSION}`);
          }
          NODE
      - name: Verify release secrets
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CSC_KEY_PASSWORD CSC_LINK; do
            if [[ -z "${!name}" ]]; then
              echo "Required release secret $name is not configured." >&2
              exit 1
            fi
          done
      - run: pnpm sdk:check
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec turbo test
      - run: pnpm sdk:pack
      - run: pnpm sdk:verify

  tui:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: linux-x64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-tui-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: turbo-tui-${{ matrix.target }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tui
      - name: Sign and notarize nyte
        if: matrix.target == 'darwin-arm64'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/nyte-signing.keychain-db"
          password=$(openssl rand -hex 24)
          trap 'security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          codesign --force --sign "Developer ID Application" --keychain "$keychain" --options runtime --timestamp --entitlements packages/tui/entitlements.plist bin/nyte
          codesign --verify --strict --verbose=2 bin/nyte
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          ditto -c -k --keepParent bin/nyte "$RUNNER_TEMP/nyte.zip"
          xcrun notarytool submit "$RUNNER_TEMP/nyte.zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notarization.json"
          cat "$RUNNER_TEMP/notarization.json"
          node -e 'const { status } = require(process.argv[1]); if (status !== "Accepted") throw new Error(`Notarization ended ${status}.`);' "$RUNNER_TEMP/notarization.json"
      - run: sh scripts/assemble-release.sh bin/nyte dist ${{ matrix.target }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: tui-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            target: mac-arm64
            command: package:mac
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: linux-x64
            command: package:linux
          - runner: blacksmith-4vcpu-windows-2025
            target: windows-x64
            command: package:win
    runs-on: ${{ matrix.runner }}
    env:
      NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      CSC_LINK: ${{ matrix.target == 'mac-arm64' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'mac-arm64' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY_ID: ${{ matrix.target == 'mac-arm64' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.target == 'mac-arm64' && secrets.APPLE_API_ISSUER || '' }}
      MAIN_VITE_NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      MAIN_VITE_NYTE_CLERK_PUBLISHABLE_KEY: ${{ vars.NYTE_CLERK_PUBLISHABLE_KEY }}
      MAIN_VITE_NYTE_CLERK_FRONTEND_API_HOST: ${{ vars.NYTE_CLERK_FRONTEND_API_HOST }}
      VITE_NYTE_CONNECT_ORIGIN: ${{ vars.NYTE_CONNECT_ORIGIN }}
      VITE_NYTE_CLERK_PUBLISHABLE_KEY: ${{ vars.NYTE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-desktop-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: turbo-desktop-${{ matrix.target }}-
      - run: pnpm install --frozen-lockfile
      - name: Check account configuration
        shell: bash
        run: |
          if [[ -z "$MAIN_VITE_NYTE_CONNECT_ORIGIN" || -z "$MAIN_VITE_NYTE_CLERK_PUBLISHABLE_KEY" || -z "$MAIN_VITE_NYTE_CLERK_FRONTEND_API_HOST" ]]; then
            echo "Account repository variables are incomplete; the build would ship without Nyte account sign-in." >&2
            exit 1
          fi
      - name: Configure Apple notarization
        if: matrix.target == 'mac-arm64'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_API_KEY_CONTENT" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "macOS release secrets are incomplete." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - run: pnpm --dir packages/desktop ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*
            !packages/desktop/dist/*-unpacked/**
            !packages/desktop/dist/mac*/**
            !packages/desktop/dist/builder-*.yml
            !packages/desktop/dist/builder-debug.yml
          if-no-files-found: error

  draft:
    needs: [tui, desktop]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Upload the binaries to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(release/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were produced." >&2
            exit 1
          fi
          draft=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq 'map(select(.tag_name == env.RELEASE_TAG)) | first | .draft')
          if [[ "$draft" == false ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            exit 0
          fi
          if [[ "$draft" == true ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" --draft --prerelease="$PRERELEASE" --target "$GITHUB_SHA" --generate-notes --title "Nyte $RELEASE_TAG"

  publish:
    needs: [verify, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Use the bootstrap npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
      - name: Publish the SDK packages
        run: pnpm release --tag "$NPM_TAG" --filter='!nyte-ai'
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
      - name: Publish the launcher
        run: pnpm release --tag "$NPM_TAG" --filter=nyte-ai
