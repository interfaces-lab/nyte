name: Test on one OS

on:
  workflow_dispatch:
    inputs:
      os:
        description: The runner OS
        type: choice
        options: [linux, windows, macos]
        default: windows
      filter:
        description: Turbo filters, such as --filter=@nyte-ai/core
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ inputs.os }}, ${{ inputs.filter }})
    runs-on: ${{ inputs.os == 'linux' && 'blacksmith-8vcpu-ubuntu-2404' || inputs.os == 'windows' && 'blacksmith-4vcpu-windows-2025' || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 45
    env:
      CENTRAL_LICENSE_KEY: ${{ secrets.CENTRAL_LICENSE_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          test-dependencies: "true"
      - name: Run tests
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          display=""
          if [ "$RUNNER_OS" = Linux ]; then display="xvfb-run --auto-servernum"; fi
          $display pnpm exec turbo run test $FILTER --concurrency=1 --continue --output-logs=full --log-order=grouped
