name: Deploy broker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy restarts every relay, so two must never overlap, and a queued one must not be dropped.
concurrency:
  group: deploy-broker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy when the bundle, config or migrations changed
        run: pnpm --dir packages/connect-broker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
