packages:
  - packages/*
  - packages/demo/*
  - packages/demo/server/*
overrides:
  "opentui-spinner@0.0.7>@opentui/core": "0.5.11"
  "opentui-spinner@0.0.7>typescript": "7.0.2"
# The TUI bundle resolves @opentui/core's native module per libc, and a bundle
# built for the wrong one cannot fall back at runtime. Installing both variants
# for this machine's platform keeps the musl target buildable and lets
# `verify:targets` check it without a release.
supportedArchitectures:
  libc:
    - current
    - musl
allowBuilds:
  cbor-extract: false
  "@central-icons-react/round-filled-radius-2-stroke-1.5": true
  "@central-icons-react/round-outlined-radius-1-stroke-1.5": true
  "@central-icons-react/round-outlined-radius-2-stroke-1.5": true
  "@google/genai": false
  "@swc/core": true
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  react-native-enriched-markdown@1.0.2: true
  workerd: true
minimumReleaseAgeExclude:
  - "@anthropic-ai/sdk@0.128.0"
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - "@tanstack/react-router@1.170.27"
  - "@tanstack/react-start-client@1.168.25"
  - "@tanstack/react-start-rsc@0.1.43"
  - "@tanstack/react-start-server@1.167.32"
  - "@tanstack/react-start@1.168.44"
  - "@tanstack/router-core@1.171.22"
  - "@tanstack/router-generator@1.167.28"
  - "@tanstack/router-plugin@1.168.30"
  - "@tanstack/start-client-core@1.170.22"
  - "@tanstack/start-plugin-core@1.171.34"
  - "@tanstack/start-server-core@1.169.26"
  - "@tanstack/start-storage-context@1.167.24"
  - "@opentui/core-darwin-arm64@0.5.6 || 0.5.7 || 0.5.8"
  - "@opentui/core-darwin-x64@0.5.6 || 0.5.7 || 0.5.8"
  - "@opentui/core-linux-arm64-musl@0.5.6 || 0.5.7 || 0.5.8"
  - "@opentui/core-linux-arm64@0.5.6 || 0.5.7 || 0.5.8"
  - "@opentui/core-linux-x64-musl@0.5.6 || 0.5.7 || 0.5.8"
