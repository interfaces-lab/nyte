packages:
  - packages/*
  - packages/examples/*
catalog:
  typescript: 6.0.3
  "@typescript/native": npm:typescript@7.1.0-beta
# The TUI bundle resolves @opentui/core's native module per libc, and a bundle
# built for the wrong one cannot fall back at runtime. Installing both variants
# for this machine's platform keeps the musl target buildable and lets
# `verify:targets` check it without a release.
supportedArchitectures:
  libc:
    - current
    - musl
allowBuilds:
  cbor-extract: false
  "@central-icons-react/round-filled-radius-2-stroke-1.5": true
  "@central-icons-react/round-outlined-radius-1-stroke-1.5": true
  "@central-icons-react/round-outlined-radius-2-stroke-1.5": true
  "@google/genai": false
  "@swc/core": true
  browser-tabs-lock: false
  core-js: false
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  react-native-enriched-markdown@1.2.0-nightly-20261011-678a5a99a: true
  workerd: true
  core-js-pure: false
  react-native-enriched-markdown: true
minimumReleaseAge: 0
patchedDependencies:
  "@pierre/diffs@1.6.0": patches/@pierre__diffs@1.6.0.patch
  ghostty-web@0.3.0: patches/ghostty-web@0.3.0.patch
  react-native-view-shot@6.1.1: patches/react-native-view-shot@6.1.1.patch
permissions:
  "@central-icons-react/round-filled-radius-2-stroke-1.5":
    skills: false
  "@central-icons-react/round-outlined-radius-1-stroke-1.5":
    skills: false
  "@central-icons-react/round-outlined-radius-2-stroke-1.5":
    skills: false
  "@tanstack/react-start":
    skills: true
skills:
  dirs:
    - .agents/skills
