packages:
  - packages/*
  - packages/demo/*
  - packages/demo/server/*
overrides:
  "opentui-spinner@0.0.7>@opentui/core": "0.5.11"
  "opentui-spinner@0.0.7>typescript": "7.0.2"
# The TUI bundle resolves @opentui/core's native module per libc, and a bundle
# built for the wrong one cannot fall back at runtime. Installing both variants
# for this machine's platform keeps the musl target buildable and lets
# `verify:targets` check it without a release.
supportedArchitectures:
  libc:
    - current
    - musl
allowBuilds:
  cbor-extract: false
  "@central-icons-react/round-filled-radius-2-stroke-1.5": true
  "@central-icons-react/round-outlined-radius-1-stroke-1.5": true
  "@central-icons-react/round-outlined-radius-2-stroke-1.5": true
  "@google/genai": false
  "@swc/core": true
  browser-tabs-lock: false
  core-js: false
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  react-native-enriched-markdown@1.0.2: true
  workerd: true
  core-js-pure: false
minimumReleaseAge: 0
patchedDependencies:
  "@use-voltra/ios-client@2.3.2": patches/@use-voltra__ios-client@2.3.2.patch
